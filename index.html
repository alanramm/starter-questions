<body>

<h1>Differentiation Practice</h1>

<div class="controls">
    <button onclick="revealAll()">Reveal All Answers</button>
    <button onclick="revealNext()">Reveal Next Answer</button>
    <button onclick="generateQuestions()">Refresh Questions</button>
</div>

<div id="grid" class="grid"></div>

<script>

let revealIndex = 0;

function renderMath() {
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function randInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function nonZero(min,max){
    let n = 0;
    while(n === 0){
        n = randInt(min,max);
    }
    return n;
}

function polynomialQuestion(){

    const a = nonZero(-9,9);
    const b = nonZero(-9,9);
    const c = randInt(-9,9);
    const p = randInt(2,6);

    return {
        key:`poly-${a}-${b}-${c}-${p}`,
        q:`\\(\\frac{d}{dx}\\left(${a}x^{${p}}${b>=0?'+':''}${b}x${c>=0?'+':''}${c}\\right)\\)`,
        a:`\\(${a*p}x^{${p-1}}${b>=0?'+':''}${b}\\)`
    };
}

function expQuestion(){

    const a = randInt(1,9);
    const k = nonZero(-6,6);

    return {
        key:`exp-${a}-${k}`,
        q:`\\(\\frac{d}{dx}\\left(${a}e^{${k}x}\\right)\\)`,
        a:`\\(${a*k}e^{${k}x}\\)`
    };
}

function trigQuestion(){

    const a = randInt(1,9);
    const b = randInt(1,8);

    if(Math.random() < 0.5){

        return {
            key:`sin-${a}-${b}`,
            q:`\\(\\frac{d}{dx}\\left(${a}\\sin(${b}x)\\right)\\)`,
            a:`\\(${a*b}\\cos(${b}x)\\)`
        };
    }

    return {
        key:`cos-${a}-${b}`,
        q:`\\(\\frac{d}{dx}\\left(${a}\\cos(${b}x)\\right)\\)`,
        a:`\\(-${a*b}\\sin(${b}x)\\)`
    };
}

function mixedQuestion(){

    const type = randInt(1,4);

    if(type===1){

        const a=randInt(2,9);
        const b=randInt(2,9);
        const k=randInt(2,6);

        return{
            key:`m1-${a}-${b}-${k}`,
            q:`\\(\\frac{d}{dx}\\left(${a}x^3+${b}e^{${k}x}\\right)\\)`,
            a:`\\(${3*a}x^2+${b*k}e^{${k}x}\\)`
        };
    }

    if(type===2){
